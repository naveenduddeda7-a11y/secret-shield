name: Secret Shield Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  security-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Secret Shield
        run: |
          python secret_shield.py